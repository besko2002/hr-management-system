server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PDFs up to 25 MB; embedding a large PDF can take a while.
    client_max_body_size 26m;

    # Security headers. Declared at server level and inherited by every location below
    # (none of them sets its own add_header, which would drop these); `always` keeps them
    # on error responses too. The built SPA loads only same-origin scripts and styles and
    # no external fonts; React style props go through the CSSOM, so no 'unsafe-inline'.
    # blob: covers the payslip/payroll downloads built from fetched Blobs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    location /api/ {
        proxy_pass http://app:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Single-page app: unknown paths fall back to index.html (React Router).
    location / {
        try_files $uri /index.html;
    }
}
