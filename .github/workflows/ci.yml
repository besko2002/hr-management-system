name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts PostgreSQL through the runner's Docker daemon.
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Test report
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do grep -h "Tests run" "$f"; done | \
            awk -F'[ ,]+' '{t+=$3; f+=$5; e+=$7} END {print "Tests: "t", failures: "f", errors: "e"}'
